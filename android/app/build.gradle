import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Signing first: the release signing config is referenced by the build types
// below, and it is what makes an installed copy updatable. See signing.gradle.
apply from: 'signing.gradle'

// ---------------------------------------------------------------------------
// Version name and code
//
// Both come from package.json, which is also what the desktop build, the web
// build and the in-app update checker compare against, so the phone can never
// claim a version the release does not have. versionCode is derived
// (major * 10000 + minor * 100 + patch) because Android ignores an update whose
// versionCode is not strictly greater than the installed one; deriving it means
// a version bump automatically produces an installable update. The formula is
// mirrored in scripts/android-version.mjs.
// ---------------------------------------------------------------------------
def packageJson = new JsonSlurper().parseText(rootProject.file('../package.json').text)
def appVersion = packageJson.version.toString()
// Plain Groovy (no destructuring) so a future Gradle/Groovy upgrade cannot
// silently change how the tuple is read.
def appVersionParts = appVersion.replaceFirst(/^v/, '').split('[-+]')[0].tokenize('.').collect { it.replaceAll(/[^0-9]/, '') as Integer }
while (appVersionParts.size() < 3) appVersionParts.add(0)
def majorVersion = appVersionParts[0]
def minorVersion = appVersionParts[1]
def patchVersion = appVersionParts[2]
if (minorVersion > 99 || patchVersion > 99) {
    throw new GradleException("Version ${appVersion} has a minor or patch number above 99, which would collide in the Android versionCode scheme.")
}
def appVersionCode = majorVersion * 10000 + minorVersion * 100 + patchVersion

android {
    namespace "com.microstocker.advancedpro"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.microstocker.advancedpro"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // Same key as release, not the per-machine debug key, so a test build
            // on a phone can be replaced by the published APK and the other way
            // round without an uninstall.
            signingConfig signingConfigs.release
        }
        release {
            // A build that reaches users must not expose WebView debugging.
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
