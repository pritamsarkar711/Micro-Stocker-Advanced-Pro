// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Performance: repositories are declared once here and nowhere else, so Gradle
// does not walk a longer list per dependency. Resolution failures are handled in
// the Android workflow (one bounded retry) because the tag build that once lost
// kotlin-stdlib-jdk8:1.9.0 was a Maven Central connection error, not a bad
// coordinate — see .github/workflows/android.yml.

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
