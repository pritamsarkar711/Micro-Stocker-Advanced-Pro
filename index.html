    <title>Micro Stocker Advanced Pro - microstock contributor toolkit</title>
    <script>
      // Apply the saved theme before first paint to avoid a white flash.
      (function () {
        try {
          var raw = localStorage.getItem('msap:settings');
          var theme = raw ? JSON.parse(raw).theme : null;
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* keep the default dark class from <html> */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
