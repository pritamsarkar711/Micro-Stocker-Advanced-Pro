<!doctype html>
<html lang="en" class="dark" data-accent="crimson">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#121619" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Microstock contributor studio: AI metadata, agency CSV export, IPTC and XMP embedding, upscaling, background removal and image conversion."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Micro Stocker Advanced Pro" />
    <meta property="og:title" content="Micro Stocker Advanced Pro" />
    <meta property="og:image" content="./icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="./icon-256.png" />
    <link rel="apple-touch-icon" href="./icon-256.png" />
    <title>Micro Stocker Advanced Pro</title>
    <script>
      (function () {
        try {
          var raw =
            localStorage.getItem('msap:data:msap:settings') ||
            localStorage.getItem('msap:data:settings');
          var parsed = raw ? JSON.parse(raw) : {};
          var theme = parsed && parsed.theme ? parsed.theme : null;
          var stored = parsed && parsed.accent;
          // Migrate legacy accent names, default to the crimson brand.
          var accent =
            stored === 'indigo' || stored === 'emerald'
              ? stored
              : stored === 'green'
                ? 'emerald'
                : 'crimson';
          var isDark =
            theme === 'dark'
              ? true
              : theme === 'light'
                ? false
                : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
          document.documentElement.dataset.accent = accent;
        } catch (e) {
          /* keep default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
