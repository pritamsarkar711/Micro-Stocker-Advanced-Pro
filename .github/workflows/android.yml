name: Android

# Builds the phone build from the same web bundle the desktop uses, signs it with
# the release key, and publishes that signed APK.
#
# Why it is a *release* build: a debug APK is built with `android:debuggable=true`
# and is not what users should install. Both build types are signed with the
# committed sideload key (android/keystore/sideload.p12), which is what lets a
# newer APK install over an older one in place instead of failing with
# INSTALL_FAILED_UPDATE_INCOMPATIBLE.
#
# Before anything is uploaded the job proves three things about the signed APK:
#   1. it verifies with apksigner (v1 + v2 signatures),
#   2. it is signed by the same key as the installed app (certificate digest is
#      compared with the committed keystore),
#   3. its versionCode/versionName match package.json and the tag.
# Without those, "download and update" would be a promise the artifact does not
# keep, so a mismatch fails the run rather than publishing a broken update.

on:
  workflow_dispatch:
  pull_request:
    # A pull request that touches the Android build, the signing setup or the
    # version contract gets the same signed build and the same verification, so
    # a signing or update regression is caught before it reaches main.
    paths:
      - 'android/**'
      - 'scripts/android-version.mjs'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android.yml'
  push:
    tags: ['v*']

permissions:
  # Read-only: this workflow builds and verifies the APK, and attaches it to the
  # release that the Release workflow (which has contents: write) creates for the
  # tag. A pull request run therefore needs no write access at all.
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      # Attaching the APK to the tag's release is the only write this job needs,
      # and it only happens for a tag push (see the last step).
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Gradle 8.2.1 and AGP 8.2.1 (the versions Capacitor 6 generates) top
          # out at Java 17; newer JDKs fail with an unsupported class file.
          java-version: '17'

      # The runner image already ships the Android SDK and accepted licences, so
      # Gradle only needs to be pointed at it. Downloading a second copy with a
      # third-party action was the slowest and most fragile step of this job.
      - name: Use the preinstalled Android SDK
        run: |-
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk/platforms" ]; then
            echo "No Android SDK found at $sdk" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          ls "$sdk/platforms" | tail -2

      # A cold Gradle cache is what turned one transient Maven Central connection
      # error into "the release has no APK" (kotlin-stdlib-jdk8:1.9.0 could not be
      # resolved). Reusing the dependency cache makes that failure far less likely
      # and cuts the build time down.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build the web bundle and sync it into the Android project
        env:
          VITE_LICENSE_SUPABASE_URL: ${{ vars.MSAP_LICENSE_SUPABASE_URL }}
          VITE_LICENSE_SUPABASE_ANON_KEY: ${{ vars.MSAP_LICENSE_SUPABASE_ANON_KEY }}
        run: |-
          npm run build:web
          npx cap sync android

      # One source of truth for the version: the same script the Gradle files
      # mirror, so the tag, package.json and the APK metadata cannot drift apart.
      - name: Read the version from package.json
        run: node scripts/android-version.mjs --github-env

      - name: Refuse a tag that disagrees with package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |-
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "v$version" ]; then
            echo "::error title=Tag mismatch::Tag $tag does not match package.json version $version"
            exit 1
          fi

      # --no-daemon: the runner is disposable. The timeouts raise Gradle's default
      # 30s HTTP timeout, and the single retry only fires on connection-level
      # errors, so a genuinely missing artifact still fails immediately with the
      # real reason in the annotation below.
      - name: Assemble the signed release and debug APKs
        working-directory: android
        env:
          # Left unset for a normal build, where signing.gradle uses the
          # committed sideload key. When all four are set as repository secrets,
          # the release is signed with that key instead, and the verification
          # step below compares against the same key.
          MSAP_ANDROID_KEYSTORE_PATH: ${{ secrets.MSAP_ANDROID_KEYSTORE_PATH }}
          MSAP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MSAP_ANDROID_KEYSTORE_PASSWORD }}
          MSAP_ANDROID_KEY_ALIAS: ${{ secrets.MSAP_ANDROID_KEY_ALIAS }}
          MSAP_ANDROID_KEY_PASSWORD: ${{ secrets.MSAP_ANDROID_KEY_PASSWORD }}
        run: |-
          chmod +x gradlew
          set -o pipefail
          attempt=1
          while true; do
            if ./gradlew assembleRelease assembleDebug \
                 --no-daemon --stacktrace --max-workers=2 \
                 -Dorg.gradle.internal.http.connectionTimeout=60000 \
                 -Dorg.gradle.internal.http.socketTimeout=60000 \
                 2>&1 | tee ../gradle.log; then
              break
            fi
            if [ "$attempt" -lt 2 ] && grep -qiE 'Could not (resolve|GET|HEAD|download)|Connection (reset|refused)|Read timed out|SSLException|Remote host terminated|unexpected end of stream' ../gradle.log; then
              attempt=$((attempt + 1))
              echo "::warning title=Gradle retry::Dependency resolution hit a network error; retrying once."
              sleep 20
              continue
            fi
            exit 1
          done

      # If Gradle fails, its own log is the only useful diagnostic and the run
      # log is awkward to read on a phone, so the reason is surfaced as an
      # annotation on the run itself.
      - name: Report the Gradle failure
        if: failure()
        run: |-
          log=gradle.log
          [ -f "$log" ] || exit 0
          reason=$(awk '/What went wrong:/{flag=1} flag' "$log" | head -12 | tr '\n' '|' | cut -c1-1200)
          [ -n "$reason" ] || reason=$(tail -12 "$log" | tr '\n' '|' | cut -c1-1200)
          echo "::error title=Gradle failure::${reason}"

      # ---------------------------------------------------------------------
      # Proof that this APK can update an existing install.
      # ---------------------------------------------------------------------
      - name: Verify the release APK is signed, installable and the right version
        env:
          # Set the repository variable MSAP_ANDROID_ALLOW_KEY_ROTATION to 1 only
          # for a deliberate, documented key rotation; existing installs then have
          # to uninstall once, so the default is to fail instead.
          MSAP_ANDROID_ALLOW_KEY_ROTATION: ${{ vars.MSAP_ANDROID_ALLOW_KEY_ROTATION }}
          # Present only when the release key is managed as secrets rather than
          # the committed sideload key; the comparison follows the same key.
          MSAP_ANDROID_KEYSTORE_PATH: ${{ secrets.MSAP_ANDROID_KEYSTORE_PATH }}
          MSAP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MSAP_ANDROID_KEYSTORE_PASSWORD }}
          MSAP_ANDROID_KEY_ALIAS: ${{ secrets.MSAP_ANDROID_KEY_ALIAS }}
          MSAP_ANDROID_KEY_PASSWORD: ${{ secrets.MSAP_ANDROID_KEY_PASSWORD }}
        run: |-
          set -euo pipefail
          sdk="${ANDROID_HOME}"
          # Newest installed build-tools; the runner always ships several.
          build_tools=$(find "$sdk/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          apksigner="${build_tools}/apksigner"
          aapt2="${build_tools}/aapt2"
          for tool in "$apksigner" "$aapt2"; do
            test -x "$tool" || { echo "::error title=Missing tool::$tool not found in $build_tools"; exit 1; }
          done
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error title=Missing APK::No release APK was produced at $apk"; exit 1; }

          echo "### Signature"
          "$apksigner" verify --verbose --print-certs "$apk" | tee signature.txt
          # Any unsigned output or a failure exit is fatal; --verbose prints
          # "Verified using v1 scheme" / "v2 scheme" when the APK verifies.
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt \
            || { echo "::error title=Signature::The release APK has no valid v2 signature"; exit 1; }

          signer_sha256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          test -n "$signer_sha256" || { echo "::error title=Signature::Could not read the signer certificate"; exit 1; }

          # The digest of the key existing installs were signed with. An update
          # only installs when the two match, so the APK's signer is compared with
          # the key this build was configured to use, not with whatever key
          # happened to end up in the signing config.
          keystore="${MSAP_ANDROID_KEYSTORE_PATH:-android/keystore/sideload.p12}"
          storepass="${MSAP_ANDROID_KEYSTORE_PASSWORD:-msap-sideload-2026}"
          alias="${MSAP_ANDROID_KEY_ALIAS:-sideload}"
          # Export the certificate and hash the DER bytes: identical to the value
          # apksigner prints, without parsing keytool's human-readable output.
          expected=$(keytool -exportcert -rfc -keystore "$keystore" -storetype PKCS12 \
            -storepass "$storepass" -alias "$alias" \
            | openssl x509 -outform der | sha256sum | cut -d' ' -f1)
          test -n "$expected" || { echo "::error title=Signature::Could not read the expected signing certificate from $keystore"; exit 1; }
          echo "APK signer   : $signer_sha256"
          echo "Update key   : $expected"
          if [ "$signer_sha256" != "$expected" ]; then
            if [ "${MSAP_ANDROID_ALLOW_KEY_ROTATION:-0}" = "1" ]; then
              echo "::warning title=Key rotation::APK signed with a different key than the committed sideload key. Existing installs must uninstall once."
            else
              echo "::error title=Signing key changed::The APK is signed by a different key than the committed sideload key, so existing installs cannot update to it. Restore android/keystore/sideload.p12 (or set MSAP_ANDROID_ALLOW_KEY_ROTATION=1 for a deliberate, documented rotation)."
              exit 1
            fi
          fi

          echo "### Version metadata"
          # Written to a file first: `aapt2 | head -1` would make aapt2 die of
          # SIGPIPE, which `pipefail` turns into a confusing failure.
          "$aapt2" dump badging "$apk" > badging.txt
          package_line=$(sed -n '/^package:/p' badging.txt)
          echo "$package_line"
          apk_code=$(printf '%s' "$package_line" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          apk_name=$(printf '%s' "$package_line" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "Expected: versionName=$version versionCode=$versionCode"
          [ "$apk_code" = "$versionCode" ] || { echo "::error title=versionCode::APK has versionCode $apk_code, package.json implies $versionCode. An update would be rejected."; exit 1; }
          [ "$apk_name" = "$version" ] || { echo "::error title=versionName::APK has versionName $apk_name, expected $version"; exit 1; }

          # A debuggable build must never be the thing users install.
          if grep -q 'application-debuggable' badging.txt; then
            echo "::error title=Debuggable::The release APK is marked debuggable"; exit 1
          fi

          echo "::notice title=Signed release APK verified::versionCode $apk_code, versionName $apk_name, signer ${signer_sha256:0:16}…"

      # Only the release APK is published to the release page: two APK names in
      # one release is how a user ends up installing the debuggable build. The
      # debug APK stays available as a workflow artifact for diagnostics.
      - name: Name the artifacts with the version
        run: |-
          mkdir -p out
          release_apk="out/micro-stocker-pro-${version}-release.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$release_apk"
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "out/micro-stocker-pro-${version}-debug.apk"
          fi
          # A checksum next to the download lets a user confirm the file they
          # installed is the one this run produced.
          (cd out && sha256sum "$(basename "$release_apk")" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: micro-stocker-pro-android-${{ env.version }}${{ github.event_name == 'pull_request' && '-pr' || '' }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          retention-days: 90

      # Attaches to the release the tag build is already creating. `draft: true`
      # means this step never publishes a release on its own; the Release
      # workflow owns publishing, so the two tag workflows cannot create two
      # releases for one tag.
      - name: Attach the APK and checksums to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*-release.apk
            out/SHA256SUMS.txt
          draft: true
          fail_on_unmatched_files: false
