name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publish release with exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          [[ "$GITHUB_REF" == refs/tags/* ]] && TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Micro Stocker Advanced Pro $TAG" --notes "Windows downloads below: the Setup .exe installer (recommended) and the portable .exe. Not code-signed, so SmartScreen may warn - click More info, then Run anyway."
          shopt -s nullglob
          gh release upload "$TAG" release/*.exe release/*.blockmap release/latest*.yml --clobber
