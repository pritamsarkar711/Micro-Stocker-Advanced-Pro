name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify and build configured app
        shell: bash
        env:
          VITE_LICENSE_SUPABASE_URL: ${{ vars.MSAP_LICENSE_SUPABASE_URL }}
          VITE_LICENSE_SUPABASE_ANON_KEY: ${{ vars.MSAP_LICENSE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_LICENSE_SUPABASE_URL" || { echo "Licensing project URL is not configured"; exit 1; }
          test -n "$VITE_LICENSE_SUPABASE_ANON_KEY" || { echo "Licensing public key is not configured"; exit 1; }
          npm run verify
      - name: Check the backend wiring
        shell: bash
        env:
          BACKEND_URL: ${{ vars.MSAP_LICENSE_SUPABASE_URL }}
        run: |
          host=$(printf '%s' "$BACKEND_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          echo "Bundled backend project: $host"
          case "$BACKEND_URL" in
            *djlmbsaltjqsqpwqdvsg*) echo "Points at the Pro platform project" ;;
            *) echo "MSAP_LICENSE_SUPABASE_URL does not point at the Pro platform project"; exit 1 ;;
          esac
      - run: npx electron-builder --config electron-builder.yml --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke-test Windows installer and application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem release -Filter '*Setup*.exe')
          $portables = @(Get-ChildItem release -Filter '*portable*.exe')
          if ($installers.Count -ne 1 -or $portables.Count -ne 1) { throw 'Expected exactly one installer and portable executable' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Micro Stocker smoke test'
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed with exit code $($installer.ExitCode)" }
          $installed = Join-Path $installDir 'Micro Stocker Advanced Pro.exe'
          if (-not (Test-Path $installed)) { throw 'Installed application executable not found' }
          $app = Start-Process -FilePath $installed -PassThru
          try {
            Start-Sleep -Seconds 15
            $app.Refresh()
            if ($app.HasExited) { throw "Installed application exited during startup with code $($app.ExitCode)" }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Upload executables to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION_TAG="v$(node -p "require('./package.json').version")"
          TAG="$VERSION_TAG"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          [[ "$TAG" == "$VERSION_TAG" ]] || { echo "Tag and package version do not match"; exit 1; }
          shopt -s nullglob
          installers=(release/*Setup*.exe)
          portables=(release/*portable*.exe)
          (( ${#installers[@]} == 1 && ${#portables[@]} == 1 )) || { echo "Expected one installer and one portable executable"; exit 1; }
          if gh release view "$TAG" --json isDraft --jq .isDraft > release-draft-status.txt 2>/dev/null; then
            if [[ "$(cat release-draft-status.txt)" != true ]]; then
              # A published release already exists for this tag (for example when a
              # previous run failed after publishing). Upload the same versioned
              # artifacts to it instead of failing the whole build.
              echo "Release $TAG is already published. Uploading assets from this build."
            fi
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Micro Stocker Advanced Pro $TAG" --notes "Windows downloads below: the Setup .exe installer (recommended) and the portable .exe. These builds are not code-signed, so Windows may display a SmartScreen warning. Review and test this draft before publishing."
          fi
          artifacts=(release/*.exe release/*.blockmap release/latest*.yml)
          gh release upload "$TAG" "${artifacts[@]}" --clobber
